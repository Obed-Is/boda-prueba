<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Invitación de boda</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css">


    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            background: #fff;
            width: 100%;
        }

        /* ======================================================
           PORTADA — diseño tipo "carta formal"
           ====================================================== */

        :root {
            --tinta: #3a2e22;
            --papel: #fbf6ec;
            --papel-exterior: #efe6d3;
            --oro: #a9823e;
            --oro-claro: #c9aa6c;
            --vino: #6e2a35;
            --vino-claro: #8a3a46;
            --linea: #d9c9a3;
        }

        #inicio {

            position: fixed;
            inset: 0;
            z-index: 999;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 24px;
            box-sizing: border-box;


            background:

                radial-gradient(circle at center,
                    rgba(255, 255, 255, .75) 0%,
                    transparent 45%),

                radial-gradient(circle at top left,
                    #f8efd9,
                    transparent 35%),

                radial-gradient(circle at bottom right,
                    #ead7ad,
                    transparent 40%),

                linear-gradient(135deg,
                    #efe6d3,
                    #f8f1e5);


            opacity: 1;


            transition:

                opacity 1.5s ease,

                filter 1.5s ease;

        }



        #inicio.ocultar {

            opacity: 0;

            filter: blur(15px);

            pointer-events: none;

        }

        #inicio::before {

            content: "";

            position: absolute;

            inset: 0;


            background:

                radial-gradient(ellipse at center,
                    transparent 30%,
                    rgba(169, 130, 62, .12));


            pointer-events: none;

        }

        .portada {

            position: relative;

            width: 92%;

            max-width: 600px;

            height: 50vh;

            min-height: 650px;


            box-sizing: border-box;


            padding: 60px 35px;


            display: flex;

            flex-direction: column;

            justify-content: center;


            text-align: center;


            background: var(--papel);


            box-shadow:

                0 0 0 1px var(--oro),

                inset 0 0 0 6px var(--papel),

                inset 0 0 0 7px var(--oro-claro),

                0 40px 100px rgba(58, 46, 34, .40);


        }

        /* sello / monograma — elemento distintivo de la pieza */
        .sello {
            width: 95px;
            height: 95px;
            margin: 0 auto 26px;
            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background: radial-gradient(circle at 32% 28%, var(--vino-claro), var(--vino) 70%);
            box-shadow:
                0 0 0 1px var(--oro-claro),
                0 0 0 3px var(--papel),
                0 0 0 4px var(--oro),
                0 8px 16px -6px rgba(110, 42, 53, 0.55);

            font-family: "Playfair Display", serif;
            font-style: italic;
            font-size: 28px;
            letter-spacing: 1px;
            color: #ecd9b8;
            text-shadow: 0 1px 1px rgba(0, 0, 0, 0.35);
        }

        .texto-pequeno {
            font-family: "Cormorant Garamond", serif;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 3.5px;
            text-transform: uppercase;
            color: var(--oro);
            margin: 0;
        }

        .divisor {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 18px 0;
        }

        .divisor::before,
        .divisor::after {
            content: "";
            height: 1px;
            width: 46px;
            background: var(--linea);
        }

        .divisor span {
            width: 6px;
            height: 6px;
            transform: rotate(45deg);
            background: var(--oro);
            display: inline-block;
        }

        h1 {
            font-family: "Playfair Display", serif;
            font-size: 46px;
            font-weight: 600;
            color: var(--tinta);
            margin: 0 0 20px 0;
            line-height: 1.15;
        }

        h1 span {
            font-style: italic;
            font-weight: 500;
            color: var(--vino);
            padding: 0 6px;
        }

        .subtitulo {
            font-family: "Cormorant Garamond", serif;
            font-style: italic;
            font-size: 30px;
            color: #6b5c47;
            margin: 0 0 30px;
        }

        .fecha {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            margin: 0 0 40px;
            font-family: "Cormorant Garamond", serif;
            color: var(--tinta);
            line-height: 1.3;
        }

        .fecha .dia {
            font-family: "Playfair Display", serif;
            font-size: 44px;
            font-weight: 600;
            color: var(--vino);
        }

        .fecha .separador {
            width: 1px;
            height: 42px;
            background: var(--linea);
        }

        .fecha .mes-anio {
            text-align: left;
            font-size: 19px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        #abrir {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 14px;

            padding: 18px 10px;
            border: none;
            border-top: 1px solid var(--oro);
            border-bottom: 1px solid var(--oro);
            background: transparent;

            font-family: "Cormorant Garamond", serif;
            font-size: 18px;
            font-weight: 600;
            text-align: center;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--tinta);

            cursor: pointer;
            transition: color .4s ease, letter-spacing .4s ease;
        }

        #abrir .linea {
            width: 22px;
            height: 1px;
            background: var(--oro);
            transition: width .4s ease, background .4s ease;
        }

        #abrir:hover {
            color: var(--vino);
            letter-spacing: 3.5px;
        }

        #abrir:hover .linea {
            width: 34px;
            background: var(--vino);
        }

        #abrir:focus-visible {
            outline: 2px solid var(--vino);
            outline-offset: 4px;
        }

        @keyframes aparecer {

            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        @media (max-width:480px) {

            .portada {

                width: 94%;

                height: 82vh;

                min-height: 620px;


                padding: 45px 25px;

            }


            h1 {

                font-size: 42px;

            }


            .sello {

                width: 100px;

                height: 100px;

                font-size: 30px;

            }


            .subtitulo {

                font-size: 20px;

            }


            .fecha .dia {

                font-size: 42px;

            }


        }

        @media (prefers-reduced-motion: reduce) {

            .portada,
            #inicio,
            #inicio.ocultar {
                animation: none !important;
                transition: none !important;
            }
        }

        /* ====================================================== */

        #pdf-container {
            width: 100%;
            margin: 0;
            padding: 0;
        }

        canvas {

            display: block;

            width: 100vw;

            height: auto;

            margin: 0 auto 10px auto;


            opacity: 0;

            transform: translateY(30px) scale(.98);

            filter: blur(5px);


            animation: aparecerPDF 1.8s ease forwards;

        }


        @keyframes aparecerPDF {

            from {

                opacity: 0;

                transform:
                    translateY(30px) scale(.98);

                filter: blur(5px);

            }


            to {

                opacity: 1;

                transform:
                    translateY(0) scale(1);

                filter: blur(0);

            }

        }

        #cargando {

            position: fixed;
            inset: 0;

            background: white;

            display: none;

            justify-content: center;
            align-items: center;

            z-index: 998;

        }


        .loader {

            text-align: center;

            color: #8b6b42;

            animation: aparecer 1s ease;

        }


        .anillo {

            width: 50px;
            height: 50px;

            border: 3px solid #e8dccb;

            border-top-color: #b8905a;

            border-radius: 50%;

            animation: girar 1s linear infinite;

            margin: auto;

        }


        .loader p {

            margin-top: 25px;

            font-family: Georgia, serif;

            font-size: 18px;

            letter-spacing: 1px;

        }



        @keyframes girar {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }

        }

        /* =====================================
   DECORACIÓN EXTERIOR DE LA TARJETA
===================================== */

        .decoracion {


            position: absolute;


            color: #c9aa6c;


            font-size: 90px;


            opacity: .22;


            font-family: Georgia, serif;


            pointer-events: none;


            user-select: none;


        }



        .exterior-arriba {


            top: 25px;


            left: 30px;


            transform: rotate(-25deg);


            animation: flotarArriba 5s ease-in-out infinite;

        }



        .exterior-abajo {


            bottom: 25px;


            right: 30px;


            transform: rotate(155deg);


            animation: flotarAbajo 5s ease-in-out infinite;

        }




        @keyframes flotarArriba {


            0%,
            100% {

                transform:

                    rotate(-25deg) translateY(0);

            }


            50% {

                transform:

                    rotate(-25deg) translateY(10px);

            }

        }




        @keyframes flotarAbajo {


            0%,
            100% {

                transform:

                    rotate(155deg) translateY(0);

            }


            50% {

                transform:

                    rotate(155deg) translateY(-10px);

            }

        }



        /* Luz suave alrededor de la tarjeta */


        .portada {


            animation:

                sombraCarta 5s ease-in-out infinite;

        }


        #contador-boda {

            background: #faf5ec;

            padding: 90px 25px;

            text-align: center;

            color: #3a2e22;

            border-top: 1px solid #d8c7a1;

        }

        .ornamento {

            font-size: 55px;

            color: #b89252;

            margin-bottom: 20px;

        }

        #contador-boda h2 {

            font-family: "Playfair Display", serif;

            font-size: 40px;

            margin: 0;

        }

        .frase {

            font-family: "Cormorant Garamond", serif;

            font-size: 35px;

            max-width: 650px;

            margin: 25px auto 60px;

            color: #6b5c47;
        }

        .contador {

            display: flex;

            justify-content: center;

            gap: 20px;

            margin-top: 50px;

            flex-wrap: wrap;

        }

        .bloque {

            width: 120px;

            padding: 25px 10px;

            background: white;

            border: 1px solid #d9c9a3;

            box-shadow: 0 10px 25px rgba(0, 0, 0, .08);

        }

        .bloque span {

            display: block;

            font-size: 52px;

            font-family: "Playfair Display", serif;

            color: #6e2a35;

        }

        .bloque small {

            font-family: "Cormorant Garamond", serif;

            font-size: 18px;

            letter-spacing: 2px;

            text-transform: uppercase;

            color: #a9823e;

        }

        .linea-final {

            width: 140px;

            height: 1px;

            background: #b89252;

            margin: 70px auto 35px;

        }

        .gracias {

            font-family: "Cormorant Garamond", serif;

            font-size: 35px;

            font-style: italic;

            color: #6b5c47;

        }

        .firma {

            margin-top: 35px;

            font-size: 28px;

            color: #b89252;

            display: flex;

            justify-content: center;

            gap: 18px;

            align-items: center;

        }

        .firma span {

            font-family: "Playfair Display", serif;

            color: #3a2e22;

        }

        @media(max-width:600px) {

            #contador-boda {

                padding: 70px 20px;

            }

            #contador-boda h2 {

                font-size: 30px;

            }

            .frase {

                font-size: 20px;

            }

            .bloque {

                width: 42%;

            }

            .bloque span {

                font-size: 42px;

            }

        }




        @keyframes sombraCarta {


            0%,
            100% {


                box-shadow:

                    0 0 0 1px var(--oro),

                    inset 0 0 0 6px var(--papel),

                    inset 0 0 0 7px var(--oro-claro),

                    0 25px 60px -20px rgba(58, 46, 34, .35);


            }



            50% {


                box-shadow:


                    0 0 0 1px var(--oro),


                    inset 0 0 0 6px var(--papel),


                    inset 0 0 0 7px var(--oro-claro),


                    0 35px 90px -20px rgba(169, 130, 62, .45);


            }

        }

        .page {
            position: relative;
        }

        .annotationLayer {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        .annotationLayer section {
            position: absolute;
        }

        .annotationLayer a {
            position: absolute;
            display: block;
        }
    </style>

</head>

<body>


    <div id="inicio">
        <div class="decoracion exterior-arriba">
            ❦
        </div>

        <div class="decoracion exterior-abajo">
            ❦
        </div>
        <div class="portada">

            <div class="sello">M<span style="font-style:normal;color:#c9aa6c;margin:0 2px;">&</span>A</div>

            <div class="divisor"><span></span></div>

            <h1>
                Mayelin <span>&</span> Agustin
            </h1>

            <p class="subtitulo">
                Nuestra Boda
            </p>

            <button id="abrir">
                <span class="linea"></span>
                Abrir invitación
                <span class="linea"></span>
            </button>

        </div>

    </div>
    <div id="cargando">

        <div class="loader">

            <div class="anillo"></div>

            <p>
                Preparando nuestra invitación...
            </p>

        </div>

    </div>

    <audio id="musica" preload="auto" loop>
        <source src="audio.mp3" type="audio/mpeg">
    </audio>


    <div id="pdf-container"></div>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf_viewer.min.js"></script>


    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc =
            'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        const boton = document.getElementById("abrir");
        const musica = document.getElementById("musica");
        let invitacionAbierta = false;

        musica.load();

        document.addEventListener("click", async () => {
            controladorPagina();
        });


        boton.addEventListener("click", async () => {
            controladorPagina();
        });

        async function controladorPagina() {
            if (invitacionAbierta) return;

            invitacionAbierta = true;

            try {

                await musica.play();

                console.log("Música iniciada");

            } catch (e) {

                console.log("Error:", e);

            }

            document.getElementById("inicio")
                .classList.add("ocultar");


            cargarPDF();
        }



        async function cargarPDF() {

            const pdf = await pdfjsLib.getDocument("carta.pdf").promise;

            const contenedor = document.getElementById("pdf-container");


            for (let numero = 1; numero <= pdf.numPages; numero++) {


                const pagina = await pdf.getPage(numero);


                const viewportOriginal = pagina.getViewport({
                    scale: 1
                });


                // Ajustar al ancho del celular/PC
                const escala = window.innerWidth / viewportOriginal.width;


                const viewport = pagina.getViewport({
                    scale: escala
                });


                // Contenedor de la página
                const pageDiv = document.createElement("div");
                pageDiv.className = "page";

                // Canvas
                const canvas = document.createElement("canvas");
                const contexto = canvas.getContext("2d");

                canvas.width = viewport.width;
                canvas.height = viewport.height;

                pageDiv.appendChild(canvas);

                // Capa de enlaces
                const annotationLayer = document.createElement("div");
                annotationLayer.className = "annotationLayer";
                pageDiv.appendChild(annotationLayer);

                contenedor.appendChild(pageDiv);

                // Dibujar PDF
                await pagina.render({

                    canvasContext: contexto,

                    viewport: viewport

                }).promise;

                // Obtener enlaces del PDF
                const annotations = await pagina.getAnnotations();

                // Renderizar enlaces
                pdfjsLib.AnnotationLayer.render({

                    annotations: annotations,

                    div: annotationLayer,

                    page: pagina,

                    viewport: viewport.clone({ dontFlip: true }),

                    linkService: new pdfjsViewer.SimpleLinkService(),

                    renderForms: true

                });


            }

            crearContador();

            document.getElementById("cargando").style.opacity = "0";

            setTimeout(() => {

                document.getElementById("cargando").style.display = "none";

            }, 500);

        }

        function crearContador() {

            const contenedor = document.getElementById("pdf-container");

            const footer = document.createElement("section");

            footer.id = "contador-boda";

            footer.innerHTML = `

                <div class="ornamento">❦</div>

                <h2>
                    Cuenta regresiva
                </h2>

                <p class="frase">
                    Cada día nos acerca a la celebración de nuestro matrimonio.
                    Esperamos contar con tu presencia para compartir esta alegría.
                </p>


                <h2 >
                    Faltan
                </h2>

                <div class="contador">

                    <div class="bloque">
                        <span id="dias">0</span>
                        <small>Días</small>
                    </div>

                    <div class="bloque">
                        <span id="horas">0</span>
                        <small>Horas</small>
                    </div>

                    <div class="bloque">
                        <span id="minutos">0</span>
                        <small>Minutos</small>
                    </div>

                    <div class="bloque">
                        <span id="segundos">0</span>
                        <small>Segundos</small>
                    </div>

                </div>

                <div class="linea-final"></div>

                <p class="gracias">

                    Con cariño,
                    te esperamos para celebrar este momento inolvidable.

                </p>

                <div class="firma">

                    ❦

                    <span>Mayelin & Agustin</span>

                    ❦

                </div>

            `;

            contenedor.appendChild(footer);

            actualizarContador();

            setInterval(actualizarContador, 1000);

        }


        function actualizarContador() {

            const boda = new Date("December 30, 2026 17:00:00").getTime();

            const ahora = new Date().getTime();

            const diferencia = boda - ahora;

            if (diferencia <= 0) {

                document.getElementById("dias").innerHTML = 0;
                document.getElementById("horas").innerHTML = 0;
                document.getElementById("minutos").innerHTML = 0;
                document.getElementById("segundos").innerHTML = 0;

                return;

            }

            const dias = Math.floor(diferencia / (1000 * 60 * 60 * 24));

            const horas = Math.floor((diferencia % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));

            const minutos = Math.floor((diferencia % (1000 * 60 * 60)) / (1000 * 60));

            const segundos = Math.floor((diferencia % (1000 * 60)) / 1000);

            document.getElementById("dias").textContent = dias;

            document.getElementById("horas").textContent = horas;

            document.getElementById("minutos").textContent = minutos;

            document.getElementById("segundos").textContent = segundos;

        }

    </script>


</body>

</html>
